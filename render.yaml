services:
  - type: web
    name: drras-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_demo.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: DRRAS_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
